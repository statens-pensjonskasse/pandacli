name: release

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

# Serialiser release-kjøringer slik at version-bump-commits ikke bygges på
# utdatert main-tilstand eller kolliderer (required linear history).
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  bump_version:
    runs-on: ubuntu-latest
    # Kun bump direkte på main (også ved manuell workflow_dispatch).
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Get app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PUBLIC_ACTIONS_LIBRARY_APP_ID }}
          private-key: ${{ secrets.PUBLIC_ACTIONS_LIBRARY_SSH_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finn versjonsbump fra commits (skip release commits)
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          # Siste tag (om finnes) for å avgrense commit-range
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          # Hvis HEAD allerede er en release-commit: ikke bump på nytt (unngå loop)
          HEAD_SUBJECT="$(git log -1 --pretty=format:%s)"
          if echo "$HEAD_SUBJECT" | grep -qE '^chore\(release\):'; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Commits siden siste tag (eller hele historikken hvis ingen tag),
          # ekskluderer tidligere release-commits
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
            SUBJECTS="$(git log $RANGE --pretty=format:%s | grep -vE '^chore\(release\):' || true)"
            LOG="$(git log $RANGE --pretty=format:'%s%n%b%n----END----')"
          else
            SUBJECTS="$(git log --pretty=format:%s | grep -vE '^chore\(release\):' || true)"
            LOG="$(git log --pretty=format:'%s%n%b%n----END----')"
          fi

          # Standard: hver merge til main gir minst en patch-bump.
          BUMP="patch"

          # Major: feat! / feat(scope)! eller BREAKING CHANGE
          if echo "$SUBJECTS" | grep -qE '^feat(\(.+\))?!:'; then
            BUMP="major"
          elif echo "$LOG" | grep -qE 'BREAKING CHANGE'; then
            BUMP="major"
          # Minor: feat / feat(scope)
          elif echo "$SUBJECTS" | grep -qE '^feat(\(.+\))?:'; then
            BUMP="minor"
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Sjekk bump status
        shell: bash
        run: |
          echo "skal release='${{ steps.bump.outputs.should_release }}'"
          echo "bump='${{ steps.bump.outputs.bump }}'"

      - name: Bump versjon filer
        if: steps.bump.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-edit --locked
          cargo set-version --bump "${{ steps.bump.outputs.bump }}"

      - name: Les ny version
        if: steps.bump.outputs.should_release == 'true'
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cargo pkgid | sed 's/.*#//')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Lag signed release commit direkte på main (og push)
        if: steps.bump.outputs.should_release == 'true'
        id: signed_commit
        uses: statens-pensjonskasse/gha-create-signed-commit@9952bb63c5cf19fd075e319bd25e5fd03a261b0a # v0.1.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: main
          message: "chore(release): v${{ steps.ver.outputs.version }}"
          paths: |
            Cargo.toml
            Cargo.lock
          push: true
