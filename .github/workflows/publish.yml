name: publish

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  # Publiser kun når siste commit på main er en release-commit.
  # Leser emnet fra git i stedet for github.event.head_commit, som er tomt
  # ved manuell kjøring (workflow_dispatch). Manuell kjøring kan dermed brukes
  # til å publisere en release på nytt hvis noe feilet.
  gate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      should_publish: ${{ steps.g.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4

      - id: g
        shell: bash
        run: |
          set -euo pipefail
          SUBJECT="$(git log -1 --format=%s)"
          echo "Siste commit: $SUBJECT"
          if [[ "$SUBJECT" =~ ^chore\(release\):\ v ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.should_publish == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            suffix: "linux-x86_64"
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            suffix: "macos-aarch64"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Installerer versjonen fra rust-toolchain.toml, pluss target for bygget.
      - name: Installer Rust
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.target }}"

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "target/${{ matrix.target }}/release/pcli" "release/pcli-${{ matrix.suffix }}${{ matrix.ext }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.suffix }}
          path: release/*

  release:
    needs: [gate, build]
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Bestemme version + tag
        id: v
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cargo pkgid | sed 's/.*#//')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Last ned alle artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Lag tag hvis den mangler
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          # Sjekk mot origin: checkout henter ikke tags, så en lokal sjekk
          # finner aldri en eksisterende tag og push feiler ved ny kjøring.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag exists: $TAG"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Lag/oppdater GitHub Release og last opp binary (single job)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          VERSION="${{ steps.v.outputs.version }}"

          # Create release if it doesn't exist (leave as draft until assets uploaded)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists: $TAG"
          else
            # Release notes genereres fra PR-ene siden forrige release.
            gh release create "$TAG" --title "$TAG" --generate-notes --draft
          fi

          # Upload all binaries (from matrix builds)
          find dist -type f -maxdepth 3 -print0 | xargs -0 -I{} gh release upload "$TAG" "{}" --clobber

          # Publish (important if you use immutable releases: publish after assets)
          gh release edit "$TAG" --draft=false
