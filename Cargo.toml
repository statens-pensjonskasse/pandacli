[package]
name = "pandacli"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "pcli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.1.2"
rand = "0.9.3"
rayon = "1.10"
indicatif = "0.18.0"
uuid = { version = "1.4", features = ["v4"] }

[dev-dependencies]
serde = { version = "1.0.219", features = ["derive"] }
tempfile = "3.23.0"
